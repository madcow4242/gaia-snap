apps:
  amd-gaia:
    command: bin/gaia-launcher.sh
    extensions: [gnome]
    desktop: usr/share/applications/amd-gaia.desktop
    plugs:
      - network
      - network-bind
      - home
      - x11
      - desktop
      - desktop-legacy
      - opengl
      - gsettings
      - browser-support

parts:
  # PART 1: UI Desktop Archive Extraction
  gaia-desktop:
    plugin: dump
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia/releases/download/v0.19.0/gaia-agent-ui-0.19.0-amd64.deb
    source-type: deb
    stage-packages:
      - libdrm2
      - libgl1-mesa-dri
      - libglx-mesa0
      - libproxy1v5
      - chromium-browser  # FIXED: Bundling standard sandbox browser components for backend tools
      - chromium-codecs-ffmpeg-extra
    override-build: |
      craftctl default
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/pixmaps"
      TARGET_ICON=$(find "${CRAFT_PART_INSTALL}/usr/share" -type f -name "*.png" | head -n 1)
      if [ -n "$TARGET_ICON" ]; then
         ln -sf "$TARGET_ICON" "${CRAFT_PART_INSTALL}/usr/share/pixmaps/amd-gaia.png"
      fi
      
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/applications"
      TARGET_DESKTOP=$(find "${CRAFT_PART_INSTALL}/usr/share" -type f -name "*.desktop" | head -n 1)
      if [ -n "$TARGET_DESKTOP" ]; then
         cp -av "$TARGET_DESKTOP" "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
         sed -i 's/^Icon=.*/Icon=amd-gaia/' "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
         sed -i 's/^Exec=.*/Exec=amd-gaia/' "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
      fi

  # PART 2: Python Framework Backend Compilation
  gaia-backend:
    plugin: python
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia.git
    source-tag: v0.19.0
    override-pull: |
      craftctl default
      echo "-e .[ui]" > "${CRAFT_PART_SRC}/requirements-extras.txt"
    python-requirements:
      - requirements-extras.txt

  # PART 3: Sideload local configuration scripts
  gaia-sideloads:
    plugin: dump
    source: .
    organize:
      gaia-launcher.sh: bin/gaia-launcher.sh
    stage:
      - bin/gaia-launcher.sh
      - bin/socat
      - network-wizard/
      - gaia/
      - usr/share/libdrm/
    prime:
      - bin/gaia-launcher.sh
      - bin/socat
      - network-wizard/
      - gaia/
      - usr/share/libdrm/
    override-build: |
      craftctl default
      
      # Pull and extract socat cleanly inside the container runtime environment
      apt-get download socat
      dpkg-deb -x socat_*.deb .
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      cp -aL usr/bin/socat "${CRAFT_PART_INSTALL}/bin/socat"
      
      # Copy network wizard assets directly into the partition tree location
      cp -r "${CRAFT_PART_SRC}/network-wizard" "${CRAFT_PART_INSTALL}/"
      
      # Link explicit graphics firmware descriptors safely
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/libdrm"
      cp -av /usr/share/libdrm/amdgpu.ids "${CRAFT_PART_INSTALL}/usr/share/libdrm/" 2>/dev/null || true
      
      # Seed system management agent manifests into the framework global library mapping
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/gaia-agents/network-wizard"
      cp -av "${CRAFT_PART_SRC}/network-wizard/." "${CRAFT_PART_INSTALL}/usr/share/gaia-agents/network-wizard/"

# NATIVE CONFIGURATION LOCK
passthrough:
  defaults:
    backend:
      url: http://127.0.0.1:13305
      openai-key: ""
      anthropic-key: ""
      groq-key: ""
      tavily-key: ""
      serper-key: ""


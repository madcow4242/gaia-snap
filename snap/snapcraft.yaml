apps:
  amd-gaia:
    command: bin/gaia-launcher.sh
    extensions: [gnome]
    desktop: usr/share/applications/amd-gaia.desktop
    plugs:
      - network
      - network-bind
      - x11
      - desktop
      - desktop-legacy
      - opengl
      - gsettings
      - browser-support
      - home
      - home-read-only
    environment:
      HOME: "$SNAP_USER_DATA"               # 🌟 TARGET FIXED: Overrides os.homedir() to allow writable sandbox configurations
      ELECTRON_DISABLE_SANDBOX: "1"         # ℹ️ Disables inner chromium sandbox blocks
      ELECTRON_OZONE_PLATFORM_HINT: auto    # ℹ️ Optimizes platform layer rendering paths

plugs:
  home-read-only:
    interface: personal-files
    read:
      - $HOME/Documents
      - $HOME/Downloads
      - $HOME/Desktop
      - $HOME/Projects
      - $HOME/Development
      - $HOME/.gitconfig

parts:
  # PART 1: UI Desktop Archive Extraction
  gaia-desktop:
    plugin: dump
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia/releases/download/v0.20.0/gaia-agent-ui-0.20.0-amd64.deb
    source-type: deb
    stage-packages:
      - libdrm2
      - libgl1-mesa-dri
      - libglx-mesa0
      - libproxy1v5
      - chromium-browser
      - chromium-codecs-ffmpeg-extra
    override-build: |
      craftctl default
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/pixmaps"
      TARGET_ICON=$(find "${CRAFT_PART_INSTALL}/usr/share" -type f -name "*.png" | head -n 1)
      if [ -n "$TARGET_ICON" ]; then
         ln -sf "$TARGET_ICON" "${CRAFT_PART_INSTALL}/usr/share/pixmaps/amd-gaia.png"
      fi
       
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/applications"
      TARGET_DESKTOP=$(find "${CRAFT_PART_INSTALL}/usr/share" -type f -name "*.desktop" | head -n 1)
      if [ -n "$TARGET_DESKTOP" ]; then
         cp -av "$TARGET_DESKTOP" "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
         sed -i 's/^Icon=.*/Icon=amd-gaia/' "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
         sed -i 's/^Exec=.*/Exec=amd-gaia/' "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"
      fi
       
      sed -i 's/^Icon=.*/Icon=amd-gaia/' "${CRAFT_PART_INSTALL}/usr/share/applications/amd-gaia.desktop"

  # PART 2: Python Framework Backend Compilation
  gaia-backend:
    plugin: python
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia.git
    source-tag: v0.20.0
    override-pull: |
      craftctl default
      echo "-e .[ui]" > "${CRAFT_PART_SRC}/requirements-extras.txt"
    python-requirements:
      - requirements-extras.txt

  # PART 3: Sideload local configuration scripts
  gaia-sideloads:
    plugin: dump
    source: .
    stage:
      - bin/gaia-launcher.sh
      - bin/socat
      - _gaia_sandbox_patch.py
      - network-wizard/
      - usr/share/libdrm/
    prime:
      - bin/gaia-launcher.sh
      - bin/socat
      - _gaia_sandbox_patch.py
      - network-wizard/
      - usr/share/libdrm/
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}/bin"

      # 2. Manually deploy our launcher and low-level sandbox bootstrap patch scripts
      cp -av "${CRAFT_PART_SRC}/gaia-launcher.sh" "${CRAFT_PART_INSTALL}/bin/gaia-launcher.sh"
      cp -av "${CRAFT_PART_SRC}/_gaia_sandbox_patch.py" "${CRAFT_PART_INSTALL}/_gaia_sandbox_patch.py"

      # 3. Download, extract, and stage port forwarding dependencies
      apt-get download socat
      dpkg-deb -x socat_*.deb .
      cp -aL usr/bin/socat "${CRAFT_PART_INSTALL}/bin/socat"

      # 4. Mirror the network wizard agent files for registration
      cp -r "${CRAFT_PART_SRC}/network-wizard" "${CRAFT_PART_INSTALL}/"

      # 5. Patch fallback container hardware acceleration tables
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/libdrm"
      cp -av /usr/share/libdrm/amdgpu.ids "${CRAFT_PART_INSTALL}/usr/share/libdrm/" 2>/dev/null || true

      # 6. Pre-seed the internal system agent discovery storage targets
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/gaia-agents/network-wizard"
      cp -av "${CRAFT_PART_SRC}/network-wizard/." "${CRAFT_PART_INSTALL}/usr/share/gaia-agents/network-wizard/"

# NATIVE CONFIGURATION LOCK
passthrough:
  defaults:
    backend:
      url: http://127.0.0.1:13305
      openai-key: ""
      anthropic-key: ""
      groq-key: ""
      tavily-key: ""
      serper-key: ""
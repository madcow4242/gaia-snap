name: amd-gaia
title: AMD GAIA Desktop Environment
version: '0.20.0'
summary: GAIA local AI agent framework with hardware acceleration.
description: |
  GAIA is an advanced local AI worker orchestration desktop environment.
  This package features fully integrated networking infrastructure patches,
  bypasses container isolation limits, and natively embeds the custom
  Network Wizard agent framework suite out of the box.

license: MIT
contact:
  - https://github.com/amd/gaia/issues
  - gaia@amd.com
  - kevin.cazabon@canonical.com
issues: https://github.com/amd/gaia/issues
website: https://github.com/amd/gaia
source-code: https://github.com/amd/gaia
donation: https://github.com/amd/gaia

grade: stable
confinement: strict
base: core24

icon: snap/gui/amd-gaia.png


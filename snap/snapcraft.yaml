name: gaia-desktop
title: AMD GAIA Desktop Environment
summary: Local AI agent framework with hardware acceleration classic mode
description: |
  GAIA is an advanced local AI worker orchestration desktop environment.
  This version uses classic confinement for production host integration.

adopt-info: gaia-backend

license: MIT
contact:
  - https://github.com/amd/gaia/issues
  - gaia@amd.com
  - kevin.cazabon@canonical.com
issues: https://github.com/amd/gaia/issues
website: https://github.com/amd/gaia
source-code: https://github.com/amd/gaia
donation: https://github.com/amd/gaia

grade: stable
confinement: classic
base: core24
icon: snap/gui/amd-gaia.png

platforms:
  amd64:

lint:
  ignore:
    - classic:
        - "opt/GAIA/**"
        - "venv/**"
        - "usr/bin/**"
        - "usr/lib/**"
    - library:
        - "opt/GAIA/**"
        - "venv/**"
        - "usr/lib/*/libicuio.so*"
        - "usr/lib/*/libicutest.so*"
        - "usr/lib/*/libicutu.so*"

apps:
  gaia-desktop:
    command: bin/gaia-launcher.sh
    desktop: usr/share/applications/gaia-desktop.desktop
    environment:
      # Expose Python venv binaries so sub-agents can find python and executables
      PATH: "$SNAP/venv/bin:$SNAP/bin:$SNAP/usr/bin:$PATH"
      # Allow Python to load sitecustomize.py and sideloaded patches from gaia-sideloads
      PYTHONPATH: "$SNAP/lib/python_patches:$SNAP/venv/lib/python3.12/site-packages:$PYTHONPATH"
      # Use SNAP_USER_COMMON so config persists across snap updates and matches user space
      GAIA_AGENTS_DIR: "$SNAP_USER_COMMON/agents"
      GAIA_CONFIG_DIR: "$SNAP_USER_COMMON/.config/gaia"
    plugs:
      - network
      - network-bind
      - home  # Allow access to user's home directory for agent installations

parts:
  # part 1: build python backend runtime
  gaia-backend:
    plugin: python
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia.git
    build-packages:
      - python3-dev
      - python3-pip
      - python3-venv
      - python3-setuptools
      - git
    override-build: |
      # Allow GAIA_VERSION override from build environment; default to 0.23.0
      VERSION_TAG="0.23.0"
       
      echo "LOG: Setting snap version metadata: ${VERSION_TAG}"
      craftctl set version="${VERSION_TAG}"
       
      echo "LOG: Cleaning previous source checkout directory..."
      rm -rf "${CRAFT_PART_SRC}/cloned-framework"
       
      echo "LOG: Cloning GAIA source at tag v${VERSION_TAG}..."
      git clone --branch "v${VERSION_TAG}" https://github.com/amd/gaia.git "${CRAFT_PART_SRC}/cloned-framework"
       
      echo "LOG: Building Python virtual environment for backend..."
      python3 -m venv "${CRAFT_PART_INSTALL}/venv"
      "${CRAFT_PART_INSTALL}/venv/bin/pip" install --upgrade pip setuptools wheel
       
      echo "LOG: Installing vector index dependency (faiss-cpu)..."
      "${CRAFT_PART_INSTALL}/venv/bin/pip" install faiss-cpu
       
      "${CRAFT_PART_INSTALL}/venv/bin/pip" install "${CRAFT_PART_SRC}/cloned-framework/.[ui]"

      # ------------------------------------------------------------------
      # TEMP WORKAROUND (backward/forward compatible)
      # Context: https://github.com/amd/gaia/issues/1568
      # Purpose: Install agent packages directly from cloned GAIA source so
      # browser-capable agents are present even when PyPI wheel publishing lags.
      # Disable by setting GAIA_ENABLE_LOCAL_AGENT_WORKAROUND=0 in build env.
      # ------------------------------------------------------------------
      if [ "${GAIA_ENABLE_LOCAL_AGENT_WORKAROUND:-1}" = "1" ]; then
        echo "LOG: Local agent workaround enabled: scanning source tree for GAIA agents."

        BROWSER_AGENT_INSTALLED=0

        install_agent_if_present() {
          local agent_rel_path="$1"
          local target_path="${CRAFT_PART_SRC}/cloned-framework/${agent_rel_path}"
          if [ -d "${target_path}" ]; then
            echo "LOG: Installing local GAIA agent package: ${agent_rel_path}"
            "${CRAFT_PART_INSTALL}/venv/bin/pip" install --no-cache-dir --no-deps "${target_path}"
            return 0
          fi
          return 1
        }

        # Check browser agent across potential layout changes (0.20.0 vs 0.22.0+ vs 0.23.0+)
        # The agent structure changed in v0.23.0 from "hub/agents/python/<agent>" to "hub/agents/<agent>/<lang>"
        for candidate in \
          "hub/agents/python/browser" \
          "hub/agents/python/browser-lite" \
          "hub/agents/python/browser_lite" \
          "hub/agents/browser" \
          "hub/agents/browser-lite" \
          "hub/agents/browser_lite" \
          "agents/browser" \
          "agents/browser-lite" \
          "agents/browser_lite"; do
            if install_agent_if_present "${candidate}"; then
              BROWSER_AGENT_INSTALLED=1
            fi
        done

        if [ "${BROWSER_AGENT_INSTALLED}" -ne 1 ]; then
          echo "WARNING: No local browser agent source package found in expected directories."
          echo "WARNING: Proceeding with standard backend installation (relying on pip installed .[ui])."
        fi

        # Optional extras: install local agents if present across legacy and current locations.
        # Updated to support new agent-first layout in v0.23.0 and maintain backward compatibility
        OPTIONAL_AGENTS="analyst code connectors-demo docqa email routing docker fileio jira summarize sd blender emr"
        for optional_agent in ${OPTIONAL_AGENTS}; do
          # Try new agent-first layout first (0.23.0+)
          install_agent_if_present "hub/agents/${optional_agent}/python" || \
          # Then try legacy layout (0.22.0 and earlier)
          install_agent_if_present "hub/agents/python/${optional_agent}" || \
          # Finally try old layout (pre-0.22.0)
          install_agent_if_present "agents/${optional_agent}" || true
        done
      else
        echo "LOG: Local-agent workaround disabled (GAIA_ENABLE_LOCAL_AGENT_WORKAROUND=0)."
      fi

  # part 2: extract desktop UI artifact
  gaia-desktop:
    plugin: nil
    after:
      - gaia-backend
    build-packages:
      - wget
    override-build: |
      RESOLVED_VERSION=$(craftctl get version)
      echo "LOG: Downloading GAIA desktop .deb for version: ${RESOLVED_VERSION}"
       
      TARGET_DEB_URL="https://github.com/amd/gaia/releases/download/v${RESOLVED_VERSION}/gaia-agent-ui-${RESOLVED_VERSION}-amd64.deb"
       
      wget -qO /tmp/gaia-desktop.deb "${TARGET_DEB_URL}"
      dpkg-deb -x /tmp/gaia-desktop.deb "${CRAFT_PART_INSTALL}"
      rm -f /tmp/gaia-desktop.deb
    override-prime: |
      craftctl default
      # Remove Electron updater feed configs if present anywhere in the GAIA payload.
      find "${CRAFT_PRIME}/opt/GAIA" -type f \
        \( -name 'app-update.yml' -o -name 'dev-app-update.yml' \) \
        -print -delete || true
      mkdir -p "${CRAFT_PRIME}/opt/GAIA/resources/app.asar.unpacked/assets"
      cp "${CRAFT_PRIME}/usr/share/icons/hicolor/512x512/apps/gaia-desktop.png" \
         "${CRAFT_PRIME}/opt/GAIA/resources/app.asar.unpacked/assets/icon.png"

  # part 3: stage launcher and hook files
  gaia-sideloads:
    plugin: dump
    source: .
    stage:
      - bin/gaia-launcher.sh
      - lib/python_patches/sitecustomize.py
      - lib/python_patches/network_reliability.py
      - snap/hooks/configure
    prime:
      - bin/gaia-launcher.sh
      - lib/python_patches/sitecustomize.py
      - lib/python_patches/network_reliability.py
      - snap/hooks/configure
      - -*.snap
      - -*.tar
      - -*.tar.gz
      - -*.rock
      - -*.md
      - -*.txt
      - -LICENSE
    override-build: |
      echo "LOG: Preparing sideload directory structure..."
       
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      mkdir -p "${CRAFT_PART_INSTALL}/snap/hooks"
      mkdir -p "${CRAFT_PART_INSTALL}/lib/python_patches"
       
      cp -av "${CRAFT_PART_SRC}/gaia-launcher.sh" "${CRAFT_PART_INSTALL}/bin/gaia-launcher.sh"
      cp -av "${CRAFT_PART_SRC}/_gaia_sandbox_patch.py" "${CRAFT_PART_INSTALL}/lib/python_patches/sitecustomize.py"
      cp -av "${CRAFT_PART_SRC}/_gaia_network_reliability.py" "${CRAFT_PART_INSTALL}/lib/python_patches/network_reliability.py"
      cp -av "${CRAFT_PART_SRC}/snap/hooks/configure" "${CRAFT_PART_INSTALL}/snap/hooks/configure"

  deps:
    plugin: nil
    build-attributes: [ enable-patchelf ]
    stage-packages:
      - ocrmypdf
      - lynx
      - w3m
name: amd-gaia
title: AMD GAIA Desktop Environment
summary: Local AI agent framework with hardware acceleration classic mode
description: |
  GAIA is an advanced local AI worker orchestration desktop environment.
  This version uses classic confinement for production host integration.

adopt-info: gaia-backend

license: MIT
contact:
  - https://github.com/amd/gaia/issues
  - gaia@amd.com
  - kevin.cazabon@canonical.com
issues: https://github.com/amd/gaia/issues
website: https://github.com/amd/gaia
source-code: https://github.com/amd/gaia
donation: https://github.com/amd/gaia

grade: stable
confinement: classic
base: core24

icon: snap/gui/amd-gaia.png

# 🎯 THE FIX: Explicit bracketed recursive match vectors to mute remaining lint warnings
lint:
  ignore:
    - classic:
        - "opt/GAIA/**"
        - "venv/**"
    - library:
        - "opt/GAIA/**"
        - "venv/**"

apps:
  amd-gaia:
    command: bin/gaia-launcher.sh

parts:
  # PART 1: UI Desktop Archive Extraction
  gaia-desktop:
    plugin: dump
    after:
      - gaia-backend
    source: https://github.com/amd/gaia/releases/download/v0.20.0/gaia-agent-ui-0.20.0-amd64.deb
    source-type: deb

  # PART 2: Python Framework Backend Compilation
  gaia-backend:
    plugin: nil
    after:
      - gaia-sideloads
    source: https://github.com/amd/gaia.git
    source-tag: v0.20.0
    build-packages:
      - python3-dev
      - python3-pip
      - python3-venv
      - python3-setuptools
    override-build: |
      craftctl set version="0.20.0"
      echo "🐍 Compiling Python Backend Assets portably inside classic container namespace..."
      python3 -m venv "${CRAFT_PART_INSTALL}/venv"
      "${CRAFT_PART_INSTALL}/venv/bin/pip" install --upgrade pip setuptools wheel
      "${CRAFT_PART_INSTALL}/venv/bin/pip" install "${CRAFT_PART_SRC}/.[ui]"

  # PART 3: Sideload local configuration scripts
  gaia-sideloads:
    plugin: dump
    source: .
    stage:
      - bin/gaia-launcher.sh
    prime:
      - bin/gaia-launcher.sh
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      cp -av "${CRAFT_PART_SRC}/gaia-launcher.sh" "${CRAFT_PART_INSTALL}/bin/gaia-launcher.sh"

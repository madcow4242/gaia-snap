name: gaia-desktop
summary: OCI container runtime for GAIA
description: |
  OCI-compliant container packaging for the GAIA framework
  using a minimal runtime base.
version: &global_version "0.21.2" # shared project version anchor
license: MIT

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:

parts:
  # PART 1: Extract runtime files from the snap artifact
  gaia-container-runtime:
    plugin: dump
    source: src_rock
    build-packages:
      - squashfs-tools
    override-build: |
      TARGET_VERSION=*global_version
      echo "LOG: Preparing rock runtime layout for version: ${TARGET_VERSION}"
       
      echo "LOG: Locating snap artifact in staging directory..."
      TARGET_SNAP=$(ls -t *.snap 2>/dev/null | head -n 1)
       
      echo "LOG: Cleaning previous extraction directory..."
      rm -rf "${CRAFT_STAGE}/app_root"
       
      echo "LOG: Extracting snap filesystem into rock staging path..."
      unsquashfs -f -d "${CRAFT_STAGE}/app_root" "${TARGET_SNAP}"
       
      echo "LOG: Copying runtime files into final image layout..."
      mkdir -p "${CRAFT_PART_INSTALL}/bin"
      mkdir -p "${CRAFT_PART_INSTALL}/opt/gaia_runtime"
       
      cp -af "${CRAFT_STAGE}/app_root/bin/gaia-launcher.sh" "${CRAFT_PART_INSTALL}/bin/gaia-launcher"
      cp -rf "${CRAFT_STAGE}/app_root/"* "${CRAFT_PART_INSTALL}/opt/gaia_runtime/"

  # PART 2: Add minimal runtime dependencies
  system-dependencies:
    plugin: nil
    stage-packages:
      - libc6
      - libstdc++6
      - python3-minimal

services:
  gaia-service:
    override: replace
    command: bin/gaia-launcher
    working-dir: /opt/gaia_runtime
    environment:
      SNAP: /opt/gaia_runtime
      PYTHONPATH: /opt/gaia_runtime/lib/python_patches
      HOME: /root
    startup: enabled
name: gaia-desktop
summary: OCI container runtime for GAIA
description: |
  OCI-compliant container packaging for the GAIA framework
  using a minimal runtime base.
version: &global_version "0.22.0"
license: MIT

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:

parts:
  # PART 1: Extract runtime files from the snap artifact
  gaia-container-runtime:
    plugin: dump
    source: src_rock
    build-packages:
      - squashfs-tools
    override-build: |
      echo "LOG: Preparing rock runtime layout for version: ${CRAFT_PROJECT_VERSION:-unknown}"
       
      echo "LOG: Locating snap artifact in staging directory..."
      TARGET_SNAP=$(ls -t *.snap 2>/dev/null | head -n 1)
       
      echo "LOG: Cleaning previous extraction directory..."
      rm -rf "${CRAFT_STAGE}/app_root"
       
      echo "LOG: Extracting snap filesystem into rock staging path..."
      unsquashfs -f -d "${CRAFT_STAGE}/app_root" "${TARGET_SNAP}"
       
      echo "LOG: Copying runtime files into final image layout..."
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      mkdir -p "${CRAFT_PART_INSTALL}/opt/gaia_runtime"
       
      cp -af "${CRAFT_STAGE}/app_root/bin/gaia-launcher.sh" "${CRAFT_PART_INSTALL}/usr/bin/gaia-launcher"
      cp -rf "${CRAFT_STAGE}/app_root/"* "${CRAFT_PART_INSTALL}/opt/gaia_runtime/"
      
      echo "LOG: Setting workspace permissions for non-root container execution..."
      mkdir -p "${CRAFT_PART_INSTALL}/opt/gaia_runtime/workspace"
      chmod -R 755 "${CRAFT_PART_INSTALL}/opt/gaia_runtime"
      chmod 777 "${CRAFT_PART_INSTALL}/opt/gaia_runtime/workspace"

  # PART 2: Add minimal runtime dependencies
  system-dependencies:
    plugin: nil
    stage-packages:
      - bash
      - coreutils
      - findutils
      - libc6
      - libstdc++6
      - netcat-openbsd
      - python3.12-full
      # Tier-2.5/3 fallback browsers: network reliability tier escalation
      # lynx: lightweight text-browser for JavaScript-free content retrieval
      # chrome: full rendering engine when lynx returns empty/useless content
      - lynx
      - w3m
      - xdg-utils
      - libu2f-udev
      - fonts-liberation
      # Electron runtime: GLib/GTK3
      - libglib-2.0-0
      - libgobject-2.0-0
      - libgio-2.0-0
      - libgtk-3-0
      - libgdk-pixbuf-2.0-0
      - libgdk-pixbuf2.0-bin
      - libcanberra-gtk3-module
      - shared-mime-info
      # Electron runtime: NSS/NSPR
      - libnspr4
      - libnss3
      # Electron runtime: DBus, Cups
      - libdbus-1-3
      - libcups2
      # Electron runtime: Cairo/Pango
      - libcairo2
      - libcairo-gobject2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
      # Electron runtime: X11 display
      - libx11-6
      - libxext6
      - libxfixes3
      - libxrandr2
      - libxcomposite1
      - libxdamage1
      - libxrender1
      - libxcb1
      - libxcb-render0
      - libxcb-shm0
      - libxkbcommon0
      - libxi6
      # Electron runtime: Graphics (GBM/DRM)
      - libgbm1
      - libdrm2
      - libepoxy0
      # Electron runtime: Multimedia/Audio/Accessibility
      - libasound2
      - libatspi2.0-0
      # Electron runtime: Fonts/Text rendering
      - libfontconfig1
      - libfreetype6
      - libharfbuzz0b
      - libfribidi0
      - libthai0
      - libpixman-1-0
      - libpng16-16t64
      # Electron runtime: System services
      - libudev1
      - libexpat1
      - libkrb5-3
      - libgnutls30
      - libsystemd0
      - libavahi-common3
      - libavahi-client3

  # PART 3: Install a real Chrome binary for Tier-3 fallback inside OCI/LXD/Docker.
  # chromium-browser on Ubuntu is often a snap wrapper and is not runnable in OCI.
  browser-runtime:
    plugin: nil
    build-packages:
      - wget
    override-build: |
      set -e
      CHROME_DEB="${CRAFT_PART_BUILD}/google-chrome-stable_current_amd64.deb"
      wget -qO "${CHROME_DEB}" "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
      dpkg-deb -x "${CHROME_DEB}" "${CRAFT_PART_INSTALL}"

services:
  gaia-service:
    override: replace
    command: /usr/bin/gaia-launcher
    working-dir: /opt/gaia_runtime
    environment:
      SNAP: /opt/gaia_runtime
      PYTHONPATH: /opt/gaia_runtime/lib/python_patches
      HOME: /root
    startup: enabled